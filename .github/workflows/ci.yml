name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Die Vercel-Funktionen liegen ausserhalb des App-Projekts und wurden
      # bisher nirgends geprueft (Audit F21).
      - run: npm run typecheck:api
      - run: npm run build

      # Durchlauftests gegen die gebaute App, ohne Anmeldung
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Der vollstaendige Beratungsablauf mit Anmeldung. Alle Fehler der Audits
  # lagen hinter der Anmeldung - genau dort, wo die oeffentlichen Tests nicht
  # hinkommen. Der Test schreibt in die echte Datenbank und raeumt hinter sich
  # auf; er braucht deshalb ein eigenes Testkonto.
  #
  # Fehlen die Secrets, ueberspringt sich der Test selbst. So wird die CI in
  # Forks und fremden Pull Requests nicht rot, nur weil dort keine
  # Zugangsdaten liegen.
  e2e-angemeldet:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # Auf dem Hauptzweig darf sich der Test nicht stillschweigend
      # ueberspringen - dort sind die Secrets hinterlegt.
      E2E_PFLICHT: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Chrome bereitstellen
        # Die Installation holt Google Chrome ueber apt. Das schlaegt
        # gelegentlich an den Paketservern fehl, ohne dass am Projekt etwas
        # kaputt waere - deshalb ein zweiter Versuch, bevor der Lauf rot wird.
        run: |
          npx playwright install --with-deps chrome && exit 0
          echo "Erster Versuch fehlgeschlagen, neuer Versuch in 20 s"
          sleep 20
          npx playwright install --with-deps chrome
      - run: npm run test:e2e:angemeldet
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-angemeldet
          path: |
            playwright-report/
            test-results/
          retention-days: 7
