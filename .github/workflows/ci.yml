name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Die Vercel-Funktionen liegen ausserhalb des App-Projekts und wurden
      # bisher nirgends geprueft (Audit F21).
      - run: npm run typecheck:api
      - run: npm run build

      # Durchlauftests gegen die gebaute App, ohne Anmeldung
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
