name: Database Backup

on:
  schedule:
    - cron: '0 2 * * 0'   # Jeden Sonntag um 02:00 UTC
  workflow_dispatch:        # Manuell auslösbar über GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Datenbank-Backup via Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 << 'EOF'
          import requests, json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path

          url = os.environ["SUPABASE_URL"].rstrip("/")
          if not url.startswith("http"):
              url = "https://" + url
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          timestamp = datetime.now(timezone.utc).strftime("%Y%m%d_%H%M%S")
          backup_dir = Path(f"backup_{timestamp}")
          backup_dir.mkdir()

          headers = {
              "apikey": key,
              "Authorization": f"Bearer {key}",
              "Accept": "application/json",
          }

          tables = [
              "subscriptions",
              "user_profiles",
              "calculations",
              "single_payment_calculations",
              "best_advice_calculations",
              "pension_gap_calculations",
              "finanzvergleich_consents",
              "redeemed_codes",
              "avd_calculations",
              "net_policy_calculations",
              "withdrawal_plans",
              "berechnungs_zaehler",
              "werbe_codes",
              "werbungen",
              "fall_versionen",
          ]

          # Supabase liefert pro Anfrage hoechstens 1000 Zeilen. Ohne Blaettern
          # wuerde der Export ab dieser Groesse unbemerkt abgeschnitten.
          SEITE = 1000

          # Ohne feste Sortierung kann das Blaettern Zeilen doppeln oder auslassen.
          SORTIERUNG = {
              "subscriptions": "user_id",
              "user_profiles": "user_id",
              "finanzvergleich_consents": "id",
              "redeemed_codes": "id",
              "berechnungs_zaehler": "user_id,monat",
              # Die Empfehlungstabellen haben kein created_date
              "werbe_codes": "user_id",
              "werbungen": "id",
              # Fassungen heissen die Zeitspalte created_at; ohne Eintrag hier
              # wuerde nach created_date sortiert und die Anfrage scheitern.
              "fall_versionen": "created_at,id",
          }

          for table in tables:
              print(f"Exportiere: {table}")
              zeilen = []
              start = 0
              while True:
                  r = requests.get(
                      f"{url}/rest/v1/{table}?select=*&order={SORTIERUNG.get(table, 'created_date,id')}",
                      headers={**headers, "Range": f"{start}-{start + SEITE - 1}",
                               "Prefer": "count=exact"},
                      timeout=60,
                  )
                  if not r.ok:
                      print(f"FEHLER bei {table}: HTTP {r.status_code} – {r.text}")
                      sys.exit(1)
                  teil = r.json()
                  zeilen.extend(teil)
                  bereich = r.headers.get("content-range", "")
                  if len(teil) < SEITE:
                      break
                  start += SEITE

              # Gegenprobe: Zeilenzahl der Datenbank gegen den Export
              erwartet = None
              if "/" in bereich and bereich.split("/")[-1].isdigit():
                  erwartet = int(bereich.split("/")[-1])
              if erwartet is not None and erwartet != len(zeilen):
                  print(f"FEHLER bei {table}: {len(zeilen)} exportiert, {erwartet} laut Datenbank")
                  sys.exit(1)

              (backup_dir / f"{table}.json").write_text(json.dumps(zeilen, indent=2, ensure_ascii=False))
              print(f"  → {len(zeilen)} Zeilen exportiert")

          print(f"\nAlle Tabellen gesichert in {backup_dir}/")
          print("Hinweis: Auth-Benutzer, Schema und Zugriffsregeln (RLS) sind hier nicht")
          print("enthalten - dafuer den Supabase-Dump nutzen, siehe supabase/README.md.")
          EOF

          tar -czf "vorsorgewaage_backup_$(date +%Y%m%d_%H%M%S).tar.gz" backup_*/
          echo "Fertig."

      - name: Backup als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: "*.tar.gz"
          retention-days: 90
